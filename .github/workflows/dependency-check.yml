name: SCA Dependency-Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sca:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Base NVD locale : sans cache, chaque run retelecharge toute la base NVD (30-90 min)
      - name: Cache base NVD
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-db-${{ github.run_id }}
          restore-keys: nvd-db-

      - name: Rendre mvnw exécutable
        run: chmod +x mvnw

      - name: Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          MVN_NVD_OPTS=()
          if [ -n "$NVD_API_KEY" ]; then
            MVN_NVD_OPTS+=("-Dnvd.api.key=$NVD_API_KEY")
          else
            echo "::warning::Secret NVD_API_KEY absent : mise a jour NVD lente et instable"
            MVN_NVD_OPTS+=("-Dnvd.api.delay=10000")
          fi
          ./mvnw -B org.owasp:dependency-check-maven:aggregate "${MVN_NVD_OPTS[@]}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: '**/target/dependency-check-report.*'
          if-no-files-found: warn
