name: SCA Trivy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Télécharger les jars des dépendances
        run: |
          chmod +x mvnw
          ./mvnw -B dependency:copy-dependencies -DoutputDirectory=target/libs

      - name: Scan des dépendances (Trivy)
        run: |
          docker run --rm \
            -v "$PWD":/src \
            aquasec/trivy:latest fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --skip-files "**/pom.xml" \
            --exit-code 1 \
            --output /src/trivy-report.txt \
            /src

      - name: Afficher le rapport
        if: always()
        run: cat trivy-report.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-report.txt
