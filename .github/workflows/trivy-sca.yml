
name: SCA Trivy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  trivy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Remplir le cache Maven
        run: |
          chmod +x mvnw
          ./mvnw -B dependency:resolve

      - name: Scan des dépendances (Trivy)
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            aquasec/trivy:latest fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format table \
            --output /src/trivy-report.txt \
            /src

      - name: Afficher le rapport
        if: always()
        run: |
          if [ -f trivy-report.txt ]; then
            cat trivy-report.txt
          else
            echo "Le rapport Trivy n'a pas été généré."
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
          if-no-files-found: warn
