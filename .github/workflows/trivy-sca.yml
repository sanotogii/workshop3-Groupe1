name: SCA Trivy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan des dépendances (Trivy)
        run: |
          docker run --rm -v "$PWD":/src aquasec/trivy:latest fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --output /src/trivy-report.txt \
            /src

      - name: Afficher le rapport
        if: always()
        run: cat trivy-report.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
